# TC-02 (SPEC 10.2): CIGRE HVDC benchmark, monopole 12-pulse, 1000 MW, 500 kV, 2 kA.
# STATUS: DRAFT - the case builds and runs, but the closed-loop operating point is not yet
# stable (see docs/design/M2.md section 9). Acceptance TC-02 is NOT met.
#
# Data status (Szechtman, Wess, Thio 1991; CIGRE WG 14.02):
#   [ok]  ratings 1000 MW / 500 kV / 2 kA; AC 345 kV and 230 kV, 50 Hz; SCR 2.5
#   [ok]  converter transformers 603.73 / 591.79 MVA, 345/213.4 and 230/209.2 kV, x = 0.18 pu
#   [?]   impedance angles 84 / 75 deg, source EMF 1.088 / 0.935 pu and angles, taps
#         1.01 / 0.989, smoothing reactor 0.5968 H, DC line T 2 x 2.5 ohm, 26 uF, valve
#         snubber 5000 ohm / 0.05 uF - recalled values, to be checked against the paper
#   [x]   AC networks: the benchmark uses damped R-L-C networks (resonant near 2nd harmonic);
#         here a Thevenin R-L at the given SCR and angle (SPEC section 6)
#   [x]   AC filters: allocation chosen by VnEMT (~625 Mvar per end); the benchmark has its own
#         filter design (double-tuned + capacitor)
#   [x]   control gains and structure: VnEMT design (docs/design/M2.md), not the benchmark's
case:
  name: tc02_cigre_lcc
  description: CIGRE HVDC benchmark đơn cực 12 xung (bản nháp, chưa đạt nghiệm thu)
  solver: {dt_us: 20, t_end_s: 1.5, method: trapezoidal, cda: true}
base: {S_MVA: 1000, U_dc_kV: 500, f_Hz: 50}
meta:
  source: "Szechtman, Wess, Thio, A benchmark model for HVDC system studies, IEE 1991; xem trạng thái số liệu ở đầu file"
ac_systems:
  - {id: ACR, U_kV: 345, scr: 2.5, angle_deg: 84, U_pu: 1.088, phase_deg: 22.18}
  - {id: ACI, U_kV: 230, scr: 2.5, angle_deg: 75, U_pu: 0.935, phase_deg: -23.14}
converter_stations:
  - id: REC
    type: lcc_12pulse
    role: rectifier
    ac_system: ACR
    transformer: {S_MVA: 603.73, U1_kV: 345, U2_kV: 213.4, xk_pu: 0.18, tap: 1.01}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150}
      - {type: single_tuned, h: 13, Q_Mvar: 150}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150}
    control: {alpha_min_deg: 5}
  - id: INV
    type: lcc_12pulse
    role: inverter
    ac_system: ACI
    transformer: {S_MVA: 591.79, U1_kV: 230, U2_kV: 209.2, xk_pu: 0.18, tap: 0.989}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150}
      - {type: single_tuned, h: 13, Q_Mvar: 150}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150}
    control: {alpha_min_deg: 95, alpha_max_deg: 165, alpha_start_deg: 140, gamma_ref_deg: 15}
dc_network:
  lines:
    - {id: DCL, from: REC, to: INV, model: t, R_ohm: 5.0, L_H: 1.1936, C_F: 26.0e-6}
outputs:
  signals: [REC_CTRL.alpha, REC_CTRL.Id, REC_CTRL.Ud, REC_CTRL.Id_ord, INV_CTRL.alpha,
            INV_CTRL.gamma_min, INV_CTRL.Id, INV_CTRL.Ud, REC_DC.V, INV_DC.V, ACR_a.V, ACI_a.V]
  format: [hdf5]
  decimate: 5
