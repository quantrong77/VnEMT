# TC-04 (SPEC 10.2): LCC bipole of m4a_bipole.yaml with converter transformer tap changers
# (F5-02, F5-03), switchable AC filter groups and reactive power control (F5-04, F5-05); the
# harmonic table with/without filters (F5-06) is produced by tests/validation/test_tc04.py.
# Tap changer delays are shortened (0.1 s / 0.15 s) to keep the EMT run short; real tap
# changers act within seconds. Base system: m4a_bipole.yaml (poles as TC-02), except the
# rectifier AC system: SCR 5 (EMF 1.05 pu) instead of 2.5. With SCR 2.5 (ESCR about 1.9 with
# the filters) one tap step raises the converter Q so much that the bus voltage drops by more
# than the 1.25 % step and the tap changer cannot bring alpha back (weak-grid behaviour,
# docs/design/M4.md section 5). Slow controls are released at 0.7 s, after start-up. Line constants are ILLUSTRATIVE (typical +/-500 kV overhead line order of
# magnitude, not data of a real line): self/mutual L 1.25/0.45 mH/km, C 11/-2.5 nF/km,
# R 0.0167 ohm/km per conductor.
case:
  name: tc04_bipole_oltc
  description: Lưỡng cực LCC có OLTC, nhóm lọc đóng cắt và điều khiển Q (TC-04)
  solver: {dt_us: 20, t_end_s: 1.5, method: trapezoidal, cda: true}
base: {S_MVA: 1000, U_dc_kV: 500, f_Hz: 50}
meta:
  source: "Cực theo TC-02 (cấu hình VnEMT kiểu CIGRE); thông số đường dây minh họa"
ac_systems:
  - {id: ACR, U_kV: 345, scr: 5.0, angle_deg: 84, U_pu: 1.05, phase_deg: 22.18, P_dc_MW: 2000}
  - {id: ACI, U_kV: 230, scr: 2.5, angle_deg: 75, U_pu: 0.935, phase_deg: -23.14, P_dc_MW: 2000}
converter_stations:
  - id: RECP
    pole: positive
    q_control: {band_Mvar: 200, t_delay_s: 0.05, t_lock_s: 0.2, t_enable_s: 0.7}
    type: lcc_12pulse
    role: rectifier
    ac_system: ACR
    transformer: {S_MVA: 603.73, U1_kV: 345, U2_kV: 213.4, xk_pu: 0.18, tap: 1.01}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150, switchable: true}
      - {type: single_tuned, h: 13, Q_Mvar: 150, switchable: true}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150, switchable: true}
      - {type: capacitor, Q_Mvar: 150, switchable: true, closed: false}
    control: {alpha_min_deg: 5, kp_deg: 60, ki_deg: 2400}
    oltc: {steps: [-10, 10], step_pct: 1.25, alpha_band_deg: [12.5, 17.5], t_delay_s: 0.1, t_min_s: 0.15,
          t_enable_s: 0.7}
  - id: RECN
    pole: negative
    type: lcc_12pulse
    role: rectifier
    ac_system: ACR
    transformer: {S_MVA: 603.73, U1_kV: 345, U2_kV: 213.4, xk_pu: 0.18, tap: 1.01}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150}
      - {type: single_tuned, h: 13, Q_Mvar: 150}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150, switchable: true, closed: false}
      - {type: capacitor, Q_Mvar: 150, switchable: true, closed: false}
    control: {alpha_min_deg: 5, kp_deg: 60, ki_deg: 2400}
    oltc: {steps: [-10, 10], step_pct: 1.25, alpha_band_deg: [12.5, 17.5], t_delay_s: 0.1, t_min_s: 0.15,
          t_enable_s: 0.7}
  - id: INVP
    pole: positive
    q_control: {band_Mvar: 200, t_delay_s: 0.05, t_lock_s: 0.2, t_enable_s: 0.7}
    type: lcc_12pulse
    role: inverter
    ac_system: ACI
    transformer: {S_MVA: 591.79, U1_kV: 230, U2_kV: 209.2, xk_pu: 0.18, tap: 0.989}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150, switchable: true}
      - {type: single_tuned, h: 13, Q_Mvar: 150, switchable: true}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150, switchable: true}
    control: {alpha_min_deg: 110, alpha_max_deg: 165, alpha_start_deg: 140, gamma_ref_deg: 15,
              fast_k: 8, fast_e_pu: 0.02,
              kp_deg: 36.1, ki_deg: 2344, kp_gamma: 0.7506, ki_gamma: 30}
    oltc: {steps: [-10, 10], step_pct: 1.25, ud_ref_pu: 0.97, ud_band_pu: 0.0125, t_delay_s: 0.1, t_min_s: 0.15,
          t_enable_s: 0.7}
  - id: INVN
    pole: negative
    type: lcc_12pulse
    role: inverter
    ac_system: ACI
    transformer: {S_MVA: 591.79, U1_kV: 230, U2_kV: 209.2, xk_pu: 0.18, tap: 0.989}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150, switchable: true}
      - {type: single_tuned, h: 13, Q_Mvar: 150, switchable: true}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150, switchable: true}
    control: {alpha_min_deg: 110, alpha_max_deg: 165, alpha_start_deg: 140, gamma_ref_deg: 15,
              fast_k: 8, fast_e_pu: 0.02,
              kp_deg: 36.1, ki_deg: 2344, kp_gamma: 0.7506, ki_gamma: 30}
    oltc: {steps: [-10, 10], step_pct: 1.25, ud_ref_pu: 0.97, ud_band_pu: 0.0125, t_delay_s: 0.1, t_min_s: 0.15,
          t_enable_s: 0.7}
dc_network:
  electrodes: {ACR: 0.5, ACI: 0.5}
  lines:
    - id: DCL
      model: bergeron
      from: [RECP, RECN]
      to: [INVP, INVN]
      length_km: 300
      L_H_per_km: [1.25e-3, 0.45e-3, 0.45e-3, 1.25e-3]
      C_F_per_km: [11.0e-9, -2.5e-9, -2.5e-9, 11.0e-9]
      R_ohm_per_km: 0.0167
outputs:
  signals: [RECP_CTRL.Id, RECN_CTRL.Id, RECP_CTRL.alpha, RECN_CTRL.alpha, INVP_CTRL.Ud,
            INVP_CTRL.gamma_min, RECP_TAP.step, RECN_TAP.step, INVP_TAP.step, RECP_QC.Q,
            RECP_QC.groups_on, INVP_QC.Q, INVP_QC.groups_on, ACR_RE.I, ACR_a.V, ACR_b.V, ACR_c.V, RECP_DC.V, RECP_Ls.I]
  format: [hdf5]
  decimate: 5
