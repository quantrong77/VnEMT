# M4a acceptance case: LCC bipole (F2-03, F5-01) - two 12-pulse poles per end, each pole as
# in TC-02 (1000 MW, 500 kV, 2 kA), common AC systems (SCR 2.5 on the 2000 MW bipole), ground
# electrodes 0.5 ohm at both ends, 300 km two-conductor Bergeron line with pole coupling
# (F2-06). Line constants are ILLUSTRATIVE (typical +/-500 kV overhead line order of
# magnitude, not data of a real line): self/mutual L 1.25/0.45 mH/km, C 11/-2.5 nF/km,
# R 0.0167 ohm/km per conductor.
case:
  name: m4a_bipole
  description: Lưỡng cực LCC 12 xung, điện cực hai đầu, đường dây Bergeron hai dây
  solver: {dt_us: 20, t_end_s: 1.5, method: trapezoidal, cda: true}
base: {S_MVA: 1000, U_dc_kV: 500, f_Hz: 50}
meta:
  source: "Cực theo TC-02 (cấu hình VnEMT kiểu CIGRE); thông số đường dây minh họa"
ac_systems:
  - {id: ACR, U_kV: 345, scr: 2.5, angle_deg: 84, U_pu: 1.088, phase_deg: 22.18, P_dc_MW: 2000}
  - {id: ACI, U_kV: 230, scr: 2.5, angle_deg: 75, U_pu: 0.935, phase_deg: -23.14, P_dc_MW: 2000}
converter_stations:
  - id: RECP
    pole: positive
    type: lcc_12pulse
    role: rectifier
    ac_system: ACR
    transformer: {S_MVA: 603.73, U1_kV: 345, U2_kV: 213.4, xk_pu: 0.18, tap: 1.01}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150}
      - {type: single_tuned, h: 13, Q_Mvar: 150}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150}
    control: {alpha_min_deg: 5, kp_deg: 60, ki_deg: 2400}
  - id: RECN
    pole: negative
    type: lcc_12pulse
    role: rectifier
    ac_system: ACR
    transformer: {S_MVA: 603.73, U1_kV: 345, U2_kV: 213.4, xk_pu: 0.18, tap: 1.01}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150}
      - {type: single_tuned, h: 13, Q_Mvar: 150}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150}
    control: {alpha_min_deg: 5, kp_deg: 60, ki_deg: 2400}
  - id: INVP
    pole: positive
    type: lcc_12pulse
    role: inverter
    ac_system: ACI
    transformer: {S_MVA: 591.79, U1_kV: 230, U2_kV: 209.2, xk_pu: 0.18, tap: 0.989}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150}
      - {type: single_tuned, h: 13, Q_Mvar: 150}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150}
    control: {alpha_min_deg: 110, alpha_max_deg: 165, alpha_start_deg: 140, gamma_ref_deg: 15,
              fast_k: 8, fast_e_pu: 0.02,
              kp_deg: 36.1, ki_deg: 2344, kp_gamma: 0.7506, ki_gamma: 30}
  - id: INVN
    pole: negative
    type: lcc_12pulse
    role: inverter
    ac_system: ACI
    transformer: {S_MVA: 591.79, U1_kV: 230, U2_kV: 209.2, xk_pu: 0.18, tap: 0.989}
    smoothing_reactor_H: 0.5968
    valve: {snubber: {R_ohm: 5000, C_F: 0.05e-6}}
    filters:
      - {type: single_tuned, h: 11, Q_Mvar: 150}
      - {type: single_tuned, h: 13, Q_Mvar: 150}
      - {type: high_pass, h: 24, Q_Mvar: 175}
      - {type: capacitor, Q_Mvar: 150}
    control: {alpha_min_deg: 110, alpha_max_deg: 165, alpha_start_deg: 140, gamma_ref_deg: 15,
              fast_k: 8, fast_e_pu: 0.02,
              kp_deg: 36.1, ki_deg: 2344, kp_gamma: 0.7506, ki_gamma: 30}
dc_network:
  electrodes: {ACR: 0.5, ACI: 0.5}
  lines:
    - id: DCL
      model: bergeron
      from: [RECP, RECN]
      to: [INVP, INVN]
      length_km: 300
      L_H_per_km: [1.25e-3, 0.45e-3, 0.45e-3, 1.25e-3]
      C_F_per_km: [11.0e-9, -2.5e-9, -2.5e-9, 11.0e-9]
      R_ohm_per_km: 0.0167
outputs:
  signals: [RECP_CTRL.Id, RECN_CTRL.Id, RECP_CTRL.Ud, RECN_CTRL.Ud, RECP_CTRL.alpha, RECN_CTRL.alpha,
            INVP_CTRL.gamma_min, INVN_CTRL.gamma_min, ACR_RE.I, ACI_RE.I, RECP_DC.V, RECN_DC.V,
            RECP_Ls.I, RECN_Ls.I, ACR_a.V, ACI_a.V]
  format: [hdf5]
  decimate: 5
