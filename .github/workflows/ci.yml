name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Ruff
        run: uv run --no-sync ruff check src tests
      - name: Mypy
        run: uv run --no-sync mypy src
      - name: Pytest
        run: uv run --no-sync pytest -q -m "not pscad and not psse" --cov=vnemt --cov-report=term
      - name: Acceptance cases (M0, M1, TC-01)
        run: |
          uv run --no-sync vnemt validate cases/
          uv run --no-sync vnemt run cases/m0_rlc_series.yaml
          uv run --no-sync vnemt run cases/m1_diode_bridge.yaml
          uv run --no-sync vnemt run cases/tc01_bridge6.yaml
